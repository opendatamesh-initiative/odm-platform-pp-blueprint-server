server:
  port: 8080
  baseUrl: http://localhost:8080

blueprint:
  observer:
    name: blueprint2.0
    displayName: Blueprint 2.0
  validator:
    active: false
    evaluation-timeout-seconds: 120
    policy-engine:
      name: blueprint-service-validator
      display-name: Blueprint Service Validator
    policy:
      name: Protected Resources Integrity
      blocking: true
    git:
      credentials: []

odm:
  product-plane:
    policy-service:
      active: false
      address:
    registry-service:
      active: false
      address:

spring:
  profiles:
    active: test
  application:
    name: odm-platform-pp-blueprint-server
  banner:
    charset: UTF-8
    mode: console
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration/postgresql
  jpa:
    properties:
      hibernate:
        default_schema: odm_blueprint
        ddl-auto: validate

info:
  version: @project.version@
  name: @project.name@

application:
  title: ODM Platform Blueprint Server

logging:
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  level:
    org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG
