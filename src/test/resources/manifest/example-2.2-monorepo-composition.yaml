# Section 2.2 — README: Monorepo + composition
spec: odm-blueprint-manifest
specVersion: 1.0.0
name: full-stack-dp
version: 2.1.0
description: Parent blueprint composing storage and serving modules into one repo.

parameters:
  - key: projectSlug
    type: string
    required: true
    validation:
      pattern: '^[a-z][a-z0-9-]{1,62}$'
    ui:
      group: General Configuration
      label: Project slug
      formType: text

  - key: enablePiiMasking
    type: boolean
    default: true
    ui:
      group: Security
      label: Enable PII masking

instantiation:
  repositories:
    - key: main
      description: Single repository containing application and infrastructure

  root:
    repository: main
    targets:
      - sourcePath: ./
        repository: main
        path: core/

composition:
  - module: storage
    blueprintName: odm-blueprint-s3-lake
    blueprintVersion: 3.0.1
    parameterMapping:
      bucketPrefix: { $param: projectSlug }
      encryptAtRest: { $param: enablePiiMasking }
      region: { value: eu-west-1 }
    targets:
      - sourcePath: ./
        repository: main
        path: data-plane/storage

  - module: serving
    blueprintName: odm-blueprint-api-skeleton
    blueprintVersion: 1.4.0
    parameterMapping:
      serviceName: { $param: projectSlug }
    targets:
      - sourcePath: ./
        repository: main
        path: app/serving
