# Section 2.3 — README: Polyrepo, no composition
spec: odm-blueprint-manifest
specVersion: 1.0.0
name: split-stack-template
version: 0.5.0

parameters:
  - key: awsRegion
    type: string
    required: true
    validation:
      allowedValues: [eu-west-1, eu-central-1, us-east-1]
    ui:
      label: AWS region
      formType: dropdown

targetRepositories:
  - key: infra-repo
    description: Target repository for infrastructure code and policies
  - key: app-repo
    description: Target repository for application code
    isRoot: true

instantiation:
  - type: root
    targets:
      - sourcePath: terraform/
        repo: infra-repo
        destinationPath: terraform/
      - sourcePath: policies/
        repo: infra-repo
        destinationPath: governance/policies
      - sourcePath: application/
        repo: app-repo
        destinationPath: ./
