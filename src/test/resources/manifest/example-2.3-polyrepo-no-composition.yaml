# Section 2.3 — README: Polyrepo, no composition
spec: odm-blueprint-manifest
specVersion: 1.0.0
name: split-stack-template
version: 0.5.0

parameters:
  - key: awsRegion
    type: string
    required: true
    validation:
      allowedValues: [eu-west-1, eu-central-1, us-east-1]
    ui:
      label: AWS region
      formType: dropdown

instantiation:
  repositories:
    - key: infra-repo
      description: Target repository for infrastructure code and policies
    - key: app-repo
      description: Target repository for application code

  root:
    repository: app-repo
    targets:
      - sourcePath: terraform/
        repository: infra-repo
        path: terraform/
      - sourcePath: policies/
        repository: infra-repo
        path: governance/policies
      - sourcePath: application/
        repository: app-repo
        path: ./
