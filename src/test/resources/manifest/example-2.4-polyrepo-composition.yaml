# Section 2.4 — README: Polyrepo + composition
spec: odm-blueprint-manifest
specVersion: 1.0.0
name: mesh-polyrepo-parent
version: 1.3.0

parameters:
  - key: dataDomain
    type: string
    required: true
    ui:
      group: Governance
      label: Data domain
      formType: text

instantiation:
  repositories:
    - key: pipeline-repo
      description: Target repository for data pipeline components
    - key: api-repo
      description: Target repository for API serving components

  root:
    targets:
      - sourcePath: ./core
        repository: pipeline-repo
        path: ./

composition:
  - module: ingest
    blueprintName: odm-blueprint-ingest-batch
    blueprintVersion: 2.0.0
    parameterMapping:
      domain: dataDomain
    targets:
      - sourcePath: ./
        repository: pipeline-repo
        path: pipelines/batch

  - module: consume
    blueprintName: odm-blueprint-consumer-api
    blueprintVersion: 1.1.0
    parameterMapping:
      domain: dataDomain
    targets:
      - sourcePath: ./
        repository: api-repo
        path: services/consumer
