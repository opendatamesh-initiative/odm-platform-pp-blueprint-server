# Section 2.4 — README: Polyrepo + composition
spec: odm-blueprint-manifest
specVersion: 1.0.0
name: mesh-polyrepo-parent
version: 1.3.0

parameters:
  - key: dataDomain
    type: string
    required: true
    ui:
      group: Governance
      label: Data domain
      formType: text

targetRepositories:
  - key: pipeline-repo
    description: Target repository for data pipeline components
    isRoot: true
  - key: api-repo
    description: Target repository for API serving components

composition:
  - module: ingest
    blueprintName: odm-blueprint-ingest-batch
    blueprintVersion: 2.0.0
    parameterMapping:
      domain: { $param: dataDomain }

  - module: consume
    blueprintName: odm-blueprint-consumer-api
    blueprintVersion: 1.1.0
    parameterMapping:
      domain: { $param: dataDomain }

instantiation:
  - type: module
    moduleName: ingest
    targets:
      - sourcePath: ./
        repo: pipeline-repo
        destinationPath: ./pipelines/batch

  - type: module
    moduleName: consume
    targets:
      - sourcePath: ./
        repo: api-repo
        destinationPath: ./services/consumer

  - type: root
    targets:
      - sourcePath: ./
        repo: pipeline-repo
        destinationPath: ./core
