spec: odm-blueprint-manifest
specVersion: 1.0.0
name: exact-overlap
version: 1.0.0

targetRepositories:
  - key: main-repository
    isRoot: true

instantiation:
  - type: root
    targets:
      - sourcePath: ./a
        repo: main-repository
        destinationPath: shared/
      - sourcePath: ./b
        repo: main-repository
        destinationPath: shared/
