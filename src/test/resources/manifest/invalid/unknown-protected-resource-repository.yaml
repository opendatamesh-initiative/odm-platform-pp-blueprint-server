spec: odm-blueprint-manifest
specVersion: 1.0.0
name: unknown-protected-resource-repository
version: 1.0.0

parameters:
  - key: environment
    type: string
    required: true
  - key: retentionDays
    type: integer
    default: 90

protectedResources:
  - path: infrastructure/core/**
    repository: unknown-repo

instantiation:
  repositories:
    - key: main
  root:
    repository: main
    targets:
      - sourcePath: ./
        repository: main
        path: ./
